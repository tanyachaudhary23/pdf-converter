spring.application.name=backend
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
management.endpoints.web.exposure.include=health
server.port=${PORT:8080}
# Database (PostgreSQL). On Render these are overridden by environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5433/pdfconverter
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000

# The app works without history, so a sleeping database must not mark the whole app as DOWN
management.health.db.enabled=false